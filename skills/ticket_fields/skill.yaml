# flow: service_ticket_to_shared
# parallel_with: ReAct fill_ticket (F-SVC-001); sequence → shared / renewal gate
# agent: Extraction (POST /v1/extraction/runs) — do not confuse with ReAct tool extract_ticket_fields
skill_id: ticket_fields
control_loop: extract
department: Service Division
goal: From agent/user text produce ticket draft ticket_draft_v1 for agent confirmation or shared output write.
success_hint: Passes ticket_draft_v1; ticket_type/tag_id/sentiment/desc_text/is_complaint complete; no invented IDs.
payload_schema: ticket_draft_v1
write_ai_output: true
consumer_allow:
  - renewal_plan
  - voc_tagging
tone:
  label: Cautious confirmation
  style: Objective field wording; short factual confirmation; no must-compensate/fix promise
  forbid: Over-promising "will definitely fix/must compensate"; soothing talk
max_schema_retries: 1
max_input_chars: 4000
security:
  redact_pii: true
  prompt_forbid_extra: Do not write plaintext phone or API Key; do not promise must-compensate/must-fix
